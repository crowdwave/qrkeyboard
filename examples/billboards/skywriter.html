<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skywriter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Rubik:wght@400;600&display=swap">
<style>
/* Harbour night: sky above, skyline below, ticket booth in the corner. Single dark look. */
:root {
  color-scheme: dark;
  --sky-top: #050818;
  --sky-low: #22134a;
  --booth: #0e0b22;
  --booth-edge: #3b2f7a;
  --paper: #fff4dc;
  --muted: #b7acd9;
  --spark: #ffcf4a;
  --display: "Bungee", "Impact", sans-serif;
  --body: "Rubik", "Helvetica Neue", sans-serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--sky-top); color: var(--paper); font-family: var(--body); overflow: hidden; }
canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
.marquee { position: fixed; top: 3vmin; left: 3.5vmin; margin: 0; font: clamp(20px, 4.2vmin, 64px)/1 var(--display); letter-spacing: .02em; color: var(--paper); text-shadow: 0 0 24px #ffcf4a55; }
.marquee small { display: block; margin-top: .6vmin; font: 400 clamp(12px, 1.8vmin, 22px)/1.2 var(--body); color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }
.booth {
  position: fixed; left: 3.5vmin; bottom: 3.5vmin; width: clamp(210px, 27vmin, 380px);
  display: grid; gap: 1.2vmin; padding: 2.2vmin;
  background: var(--booth); border: 2px solid var(--booth-edge); border-radius: 18px 18px 6px 6px;
  box-shadow: 0 24px 60px #0009;
}
.booth h2 { margin: 0; font: clamp(18px, 3vmin, 40px)/1 var(--display); color: var(--spark); }
.booth p { margin: 0; font-size: clamp(13px, 1.9vmin, 23px); line-height: 1.35; color: var(--muted); }
.tally { font-variant-numeric: tabular-nums; color: var(--paper); }
.qrkeyboard-pairing { display: grid; gap: 1vmin; }
.qrkeyboard-pairing p { margin: 0; font-size: clamp(12px, 1.7vmin, 21px); color: var(--muted); }
.qrkeyboard-pairing [role="status"] { color: var(--spark); text-transform: uppercase; letter-spacing: .06em; font-weight: 600; }
.qrkeyboard-code { background: #fff; border-radius: 8px; overflow: hidden; }
.qrkeyboard-code svg { width: 100%; height: auto; display: block; }
.qrkeyboard-pairing button { font: inherit; padding: .6em 1em; border: 0; border-radius: 6px; background: var(--spark); color: var(--booth); }
.timer { height: 6px; border-radius: 3px; background: var(--booth-edge); overflow: hidden; }
.timer span { display: block; height: 100%; background: var(--spark); transform-origin: left; }
</style>
</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>
<h1 class="marquee">Skywriter<small>Your message, launched over the city</small></h1>
<aside class="booth" aria-live="polite">
  <h2 id="headline">Launch a message</h2>
  <p id="hint">Scan, write a few words, tap Launch.</p>
  <div id="qr"></div>
  <div class="timer" id="timer" hidden><span id="timeleft"></span></div>
  <p>Launched tonight: <span class="tally" id="tally">0</span></p>
</aside>
<script src="https://qrkeyboard.com/v1.js"></script>
<script>
const TURN_MS = 2 * 60 * 1000;
const IDLE_MS = 45 * 1000;
const MAX_MESSAGE = 32;           // characters that still read as fireworks
const HOLD_MS = 4200;             // how long a message hangs in the sky
const FORM_MS = 1300;             // sparks flying into letter positions
const MAX_TEXT_SPARKS = 2600;
const AMBIENT_EVERY_MS = 1400;
const ATTRACT_MESSAGE = 'SCAN TO LAUNCH';
const ATTRACT_EVERY_MS = 16000;
const PALETTES = [
  ['#ffcf4a', '#ff8a3d', '#fff4dc'], ['#7cf2ff', '#3d9bff', '#e9fbff'],
  ['#ff5fb7', '#c34bff', '#ffe3f4'], ['#9dff6a', '#3dffb1', '#efffe6'],
];

const keyboard = QRKeyboard.create({ el: '#qr', name: 'Skywriter', mode: 'text', submitLabel: 'Launch' });
const headline = document.getElementById('headline');
const hint = document.getElementById('hint');
const timer = document.getElementById('timer');
const timeLeft = document.getElementById('timeleft');
const tally = document.getElementById('tally');
let launches = 0, turnStart = 0, lastInput = 0;
const queue = [];

keyboard.on('text', ({ text }) => {
  lastInput = performance.now();
  const message = text.replace(/\s+/g, ' ').trim().toUpperCase().slice(0, MAX_MESSAGE);
  if (message) queue.push(message);
});
keyboard.on('state', ({ state }) => {
  const playing = state === 'connected';
  timer.hidden = !playing;
  if (playing && !turnStart) turnStart = lastInput = performance.now();
  headline.textContent = playing ? 'Ready to launch' : 'Launch a message';
  hint.textContent = playing ? 'Write a few words on your phone and tap Launch.' : 'Scan, write a few words, tap Launch.';
});
keyboard.on('finish', () => { turnStart = 0; queue.length = 0; });
setInterval(() => {
  if (keyboard.state !== 'connected' && keyboard.state !== 'waiting') return;
  const now = performance.now();
  timeLeft.style.transform = `scaleX(${Math.max(0, 1 - (now - turnStart) / TURN_MS)})`;
  if (now - lastInput > IDLE_MS || now - turnStart > TURN_MS) keyboard.finish().catch(() => {});
}, 500);

// ── Scene ───────────────────────────────────────────────────────────────────
const canvas = document.getElementById('sky');
const ctx = canvas.getContext('2d');
const city = document.createElement('canvas');
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
let width = 0, height = 0, horizon = 0;
let stars = [];
let sparks = [];
let rockets = [];
let show = null;          // the message currently in the sky
let lastAmbient = 0, lastAttract = -ATTRACT_EVERY_MS / 2;

function resize() {
  const scale = Math.min(devicePixelRatio || 1, 2);
  width = innerWidth; height = innerHeight; horizon = height * 0.78;
  canvas.width = width * scale; canvas.height = height * scale;
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  city.width = canvas.width; city.height = canvas.height;
  const c = city.getContext('2d');
  c.setTransform(scale, 0, 0, scale, 0, 0);
  let seed = 11;
  const random = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  for (let x = 0; x < width;) {
    const w = 30 + random() * 90, h = height * (0.08 + random() * 0.24) * (random() > 0.85 ? 1.6 : 1);
    c.fillStyle = '#05040d';
    c.fillRect(x, horizon - h, w, height - horizon + h);
    for (let wy = horizon - h + 10; wy < height - 8; wy += 14)
      for (let wx = x + 6; wx < x + w - 8; wx += 12)
        if (random() > 0.62) { c.fillStyle = random() > 0.2 ? '#ffcf6b' : '#8fd8ff'; c.globalAlpha = 0.35 + random() * 0.5; c.fillRect(wx, wy, 5, 7); }
    c.globalAlpha = 1;
    x += w + random() * 6;
  }
  // Water below the skyline.
  const water = c.createLinearGradient(0, height * 0.9, 0, height);
  water.addColorStop(0, '#0a0820'); water.addColorStop(1, '#020208');
  c.fillStyle = water; c.fillRect(0, height * 0.9, width, height * 0.1);
  stars = Array.from({ length: 180 }, () => ({ x: random() * width, y: random() * horizon * 0.9, r: random() * 1.4 + 0.3, phase: random() * 6 }));
}
addEventListener('resize', resize);

function sky(alpha) {
  const gradient = ctx.createLinearGradient(0, 0, 0, horizon);
  gradient.addColorStop(0, '#050818'); gradient.addColorStop(1, '#22134a');
  ctx.globalAlpha = alpha; ctx.fillStyle = gradient; ctx.fillRect(0, 0, width, height); ctx.globalAlpha = 1;
}

/** Points that spell `message`, sampled from an offscreen render. */
function letterPoints(message) {
  const words = message.split(' ');
  const lines = [];
  for (const word of words) {
    const last = lines[lines.length - 1];
    if (last && (last + ' ' + word).length <= 14) lines[lines.length - 1] = last + ' ' + word; else lines.push(word);
  }
  const shown = lines.slice(0, 3);
  const sample = document.createElement('canvas');
  sample.width = Math.ceil(width); sample.height = Math.ceil(horizon);
  const s = sample.getContext('2d');
  let size = height * 0.2;
  const fits = () => {
    s.font = `${size}px Bungee, Impact, sans-serif`;
    return shown.every(line => s.measureText(line).width < width * 0.78) && shown.length * size * 1.05 < horizon * 0.62;
  };
  while (!fits() && size > 16) size *= 0.92;
  s.textAlign = 'center'; s.textBaseline = 'middle'; s.fillStyle = '#fff';
  const top = horizon * 0.42 - ((shown.length - 1) * size * 1.05) / 2;
  shown.forEach((line, index) => s.fillText(line, width / 2, top + index * size * 1.05));
  const pixels = s.getImageData(0, 0, sample.width, sample.height).data;
  let step = Math.max(3, Math.round(size / 16));
  let points;
  do {
    points = [];
    for (let y = 0; y < sample.height; y += step)
      for (let x = 0; x < sample.width; x += step)
        if (pixels[(y * sample.width + x) * 4 + 3] > 128) points.push({ x, y });
    step++;
  } while (points.length > MAX_TEXT_SPARKS);
  return { points, dot: Math.max(2.5, (step - 1) * 0.7) };
}

function launch(message, now) {
  const palette = PALETTES[Math.floor(Math.random() * PALETTES.length)];
  rockets.push({ x: width * (0.35 + Math.random() * 0.3), y: horizon, vy: -height * 0.0125, apex: horizon * 0.38, message, palette, born: now });
}

function burst(x, y, palette, count, power) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2, speed = power * (0.4 + Math.random() * 0.6);
    sparks.push({ x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, life: 1, decay: 0.008 + Math.random() * 0.012, colour: palette[i % palette.length], size: 1.6 + Math.random() * 1.6 });
  }
}

function explode(rocket, now) {
  burst(rocket.x, rocket.y, rocket.palette, 160, height * 0.006);
  if (!rocket.message) return;
  const { points, dot } = letterPoints(rocket.message);
  show = {
    born: now, dot, attract: rocket.message === ATTRACT_MESSAGE,
    sparks: points.map((target, index) => ({
      fromX: rocket.x, fromY: rocket.y, x: rocket.x, y: rocket.y, tx: target.x, ty: target.y,
      delay: Math.random() * 240, colour: rocket.palette[index % rocket.palette.length], twinkle: Math.random() * 6,
    })),
  };
  if (rocket.message !== ATTRACT_MESSAGE) { launches++; tally.textContent = launches; }
}

const easeOut = t => 1 - Math.pow(1 - t, 3);

function frame(now) {
  sky(reduceMotion ? 1 : 0.32);   // translucent repaint leaves short trails
  for (const star of stars) {
    ctx.globalAlpha = 0.5 + Math.sin(now / 700 + star.phase) * 0.35;
    ctx.fillStyle = '#e8e4ff'; ctx.fillRect(star.x, star.y, star.r, star.r);
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'lighter';

  // Next message from the queue, or something to look at while nobody plays.
  // A visitor's message cuts the attract message short.
  if (show?.attract && queue.length) show.born = Math.min(show.born, now - FORM_MS - HOLD_MS - 1);
  if (!show && !rockets.some(rocket => rocket.message)) {
    if (queue.length) launch(queue.shift(), now);
    else if (keyboard.state !== 'connected' && now - lastAttract > ATTRACT_EVERY_MS) { lastAttract = now; launch(ATTRACT_MESSAGE, now); }
  }
  if (now - lastAmbient > AMBIENT_EVERY_MS && !show) {
    lastAmbient = now;
    const palette = PALETTES[Math.floor(Math.random() * PALETTES.length)];
    rockets.push({ x: width * (0.1 + Math.random() * 0.8), y: horizon, vy: -height * (0.009 + Math.random() * 0.004), apex: horizon * (0.2 + Math.random() * 0.35), message: '', palette, born: now });
  }

  rockets = rockets.filter(rocket => {
    rocket.y += rocket.vy; rocket.vy *= 0.992;
    ctx.fillStyle = rocket.palette[2]; ctx.beginPath(); ctx.arc(rocket.x, rocket.y, 2.4, 0, Math.PI * 2); ctx.fill();
    sparks.push({ x: rocket.x, y: rocket.y + 4, vx: (Math.random() - 0.5) * 0.6, vy: 1, life: 0.6, decay: 0.03, colour: '#ffd9a0', size: 1.6 });
    if (rocket.y <= rocket.apex) { explode(rocket, now); return false; }
    return true;
  });

  const gravity = height * 0.00009;
  sparks = sparks.filter(spark => {
    spark.vx *= 0.985; spark.vy = spark.vy * 0.985 + gravity * 16; spark.x += spark.vx; spark.y += spark.vy;
    spark.life -= spark.decay;
    if (spark.life <= 0) return false;
    ctx.globalAlpha = spark.life; ctx.fillStyle = spark.colour;
    ctx.fillRect(spark.x, spark.y, spark.size, spark.size);
    return true;
  });

  if (show) {
    const age = now - show.born;
    const releasing = age > FORM_MS + HOLD_MS;
    const dot = show.dot;
    for (const spark of show.sparks) {
      if (releasing) {
        // Let go: each letter spark becomes a falling ember.
        sparks.push({ x: spark.x, y: spark.y, vx: (Math.random() - 0.5) * 1.2, vy: Math.random() * 0.6, life: 0.9, decay: 0.01 + Math.random() * 0.01, colour: spark.colour, size: 2 });
        continue;
      }
      const t = Math.min(1, Math.max(0, (age - spark.delay) / FORM_MS));
      const eased = easeOut(t);
      spark.x = spark.fromX + (spark.tx - spark.fromX) * eased;
      spark.y = spark.fromY + (spark.ty - spark.fromY) * eased;
      const glitter = t < 1 ? 1 : 0.65 + Math.sin(now / 90 + spark.twinkle) * 0.35;
      ctx.globalAlpha = glitter; ctx.fillStyle = spark.colour;
      ctx.fillRect(spark.x - dot / 2, spark.y - dot / 2, dot, dot);
    }
    if (releasing) show = null;
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
  ctx.drawImage(city, 0, 0, width, height);
  requestAnimationFrame(frame);
}

resize();
sky(1);
document.fonts.load('80px Bungee').finally(() => requestAnimationFrame(frame));
</script>
</body>
</html>
