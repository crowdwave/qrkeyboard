<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flow Mural</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,800&display=swap">
<style>
/* A gallery wall at night: the painting is the screen; the label card sits low left like a museum caption. Single dark look. */
:root {
  color-scheme: dark;
  --ink: #07070c;
  --card: #f4f1ea;
  --card-ink: #15131c;
  --card-muted: #5d5868;
  --accent: #5ad1e6;
  --display: "Bricolage Grotesque", "Avenir Next", sans-serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--ink); color: var(--card); font-family: var(--display); overflow: hidden; }
canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
.mood {
  position: fixed; top: 4vmin; left: 4.5vmin; margin: 0; pointer-events: none;
  font: 800 clamp(40px, 13vmin, 200px)/.82 var(--display); letter-spacing: -.04em; color: #fff;
  text-shadow: 0 2px 30px #000c; transition: opacity .8s;
}
.byline { position: fixed; top: calc(4vmin + clamp(40px, 13vmin, 200px) * .9); left: 4.8vmin; margin: 0; font-size: clamp(13px, 2vmin, 24px); color: #ffffffb0; }
.caption {
  position: fixed; left: 4.5vmin; bottom: 4.5vmin; width: clamp(220px, 27vmin, 380px);
  display: grid; gap: 1.1vmin; padding: 2.2vmin; background: var(--card); color: var(--card-ink);
  box-shadow: 0 20px 50px #000a;
}
.caption h2 { margin: 0; font: 800 clamp(18px, 3vmin, 40px)/1 var(--display); letter-spacing: -.02em; }
.caption .meta { margin: 0; font-size: clamp(12px, 1.7vmin, 20px); color: var(--card-muted); line-height: 1.35; }
.qrkeyboard-pairing { display: grid; gap: 1vmin; }
.qrkeyboard-pairing p { margin: 0; font-size: clamp(12px, 1.7vmin, 20px); color: var(--card-muted); }
.qrkeyboard-pairing [role="status"] { color: var(--card-ink); font-weight: 800; }
.qrkeyboard-code svg { width: 100%; height: auto; display: block; }
.qrkeyboard-pairing button { font: inherit; padding: .5em 1em; border: 0; background: var(--card-ink); color: var(--card); }
@media (prefers-reduced-motion: reduce) { .mood { transition: none; } }
</style>
</head>
<body>
<canvas id="mural" aria-hidden="true"></canvas>
<h1 class="mood" id="mood">Ocean</h1>
<p class="byline" id="byline">Painting itself · scan to take the brush</p>
<aside class="caption" aria-live="polite">
  <h2 id="headline">Flow Mural</h2>
  <p class="meta" id="hint">Light on glass, 2026. Generative, live. Scan to choose its mood from your phone.</p>
  <div id="qr"></div>
</aside>
<script src="https://qrkeyboard.com/v1.js"></script>
<script>
const TURN_MS = 3 * 60 * 1000;
const IDLE_MS = 45 * 1000;
const AUTOPILOT_MS = 18 * 1000;   // mood changes by itself while nobody holds the brush
const PARTICLES = 2200;
const FADE = 0.012;               // how quickly old strokes sink back into the dark
// An 8-bit canvas cannot fade below a few levels with low-alpha fills, which
// leaves grey haze; a periodic multiply pulls those levels down proportionally.
const DEEPEN_EVERY_FRAMES = 20;
const DEEPEN_COLOUR = 'rgb(232, 232, 236)';
let frameCount = 0;
// Each mood: palette, flow scale, speed, turbulence, and a bias that shapes the field.
const MOODS = {
  ocean:  { name: 'Ocean',  colours: ['#0e5b8c', '#1fa3c4', '#5ad1e6', '#d8f6ff'], scale: 0.0016, speed: 1.1, turbulence: 1.4, bias: 'drift' },
  ember:  { name: 'Ember',  colours: ['#7a1206', '#e0401a', '#ff8a2a', '#ffd27a'], scale: 0.0032, speed: 1.8, turbulence: 2.6, bias: 'rise' },
  aurora: { name: 'Aurora', colours: ['#0e7a52', '#2fe39a', '#9b6bff', '#e3d6ff'], scale: 0.0011, speed: 1.3, turbulence: 1.0, bias: 'curtain' },
  bloom:  { name: 'Bloom',  colours: ['#c2185b', '#ff6fa8', '#ffc24d', '#fff1c9'], scale: 0.0024, speed: 1.2, turbulence: 1.8, bias: 'spiral' },
  storm:  { name: 'Storm',  colours: ['#3a4250', '#8b97a8', '#d6dde6', '#ffffff'], scale: 0.0040, speed: 2.6, turbulence: 3.2, bias: 'gust' },
};
const MOOD_IDS = Object.keys(MOODS);

const keyboard = QRKeyboard.create({
  el: '#qr', name: 'Flow Mural', caps: ['buttons'],
  actions: [...MOOD_IDS.map(id => ({ id, label: MOODS[id].name })), { id: 'wipe', label: 'Fresh canvas' }],
});
const moodEl = document.getElementById('mood');
const byline = document.getElementById('byline');
const headline = document.getElementById('headline');
const hint = document.getElementById('hint');
let mood = MOODS.ocean, nextMood = null, blend = 1;
let lastAutopilot = 0, turnStart = 0, lastInput = 0, wipeAt = 0;
let burst = null;

function setMood(id, byVisitor) {
  if (!MOODS[id] || MOODS[id] === mood) return;
  nextMood = MOODS[id]; blend = 0;
  moodEl.style.opacity = 0;
  setTimeout(() => { moodEl.textContent = MOODS[id].name; moodEl.style.opacity = 1; }, 400);
  byline.textContent = byVisitor ? 'Chosen by the visitor holding the brush' : 'Painting itself · scan to take the brush';
}

keyboard.on('action', ({ action }) => {
  lastInput = performance.now();
  if (action === 'wipe') { wipeAt = performance.now(); return; }
  setMood(action, true);
  burst = { x: width * (0.3 + Math.random() * 0.4), y: height * (0.3 + Math.random() * 0.4), at: performance.now() };
});
keyboard.on('state', ({ state }) => {
  const playing = state === 'connected';
  if (playing && !turnStart) turnStart = lastInput = performance.now();
  headline.textContent = playing ? 'You hold the brush' : 'Flow Mural';
  hint.textContent = playing ? 'Tap a mood on your phone. Fresh canvas wipes the wall.' : 'Light on glass, 2026. Generative, live. Scan to choose its mood from your phone.';
});
keyboard.on('finish', () => { turnStart = 0; byline.textContent = 'Painting itself · scan to take the brush'; });
setInterval(() => {
  if (keyboard.state !== 'connected' && keyboard.state !== 'waiting') return;
  const now = performance.now();
  if (now - lastInput > IDLE_MS || now - turnStart > TURN_MS) keyboard.finish().catch(() => {});
}, 1000);

// ── Gradient noise (2D Perlin-style) ────────────────────────────────────────
const permutation = new Uint8Array(512);
{
  const base = Array.from({ length: 256 }, (_, index) => index);
  for (let i = 255; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [base[i], base[j]] = [base[j], base[i]]; }
  for (let i = 0; i < 512; i++) permutation[i] = base[i & 255];
}
const fade = t => t * t * t * (t * (t * 6 - 15) + 10);
function gradient(hash, x, y) { const h = hash & 3; return (h & 1 ? -x : x) + (h & 2 ? -y : y); }
function noise(x, y) {
  const xi = Math.floor(x) & 255, yi = Math.floor(y) & 255;
  const xf = x - Math.floor(x), yf = y - Math.floor(y);
  const u = fade(xf), v = fade(yf);
  const aa = permutation[permutation[xi] + yi], ab = permutation[permutation[xi] + yi + 1];
  const ba = permutation[permutation[xi + 1] + yi], bb = permutation[permutation[xi + 1] + yi + 1];
  const lerp = (a, b, t) => a + (b - a) * t;
  return lerp(lerp(gradient(aa, xf, yf), gradient(ba, xf - 1, yf), u), lerp(gradient(ab, xf, yf - 1), gradient(bb, xf - 1, yf - 1), u), v);
}

// ── Painting ────────────────────────────────────────────────────────────────
const canvas = document.getElementById('mural');
const ctx = canvas.getContext('2d');
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
let width = 0, height = 0;
let particles = [];

function spawn(particle = {}) {
  particle.x = Math.random() * width; particle.y = Math.random() * height;
  particle.life = 80 + Math.random() * 220; particle.shade = Math.floor(Math.random() * 4);
  return particle;
}
function resize() {
  const scale = Math.min(devicePixelRatio || 1, 2);
  width = innerWidth; height = innerHeight;
  canvas.width = width * scale; canvas.height = height * scale;
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  ctx.fillStyle = '#07070c'; ctx.fillRect(0, 0, width, height);
  particles = Array.from({ length: PARTICLES }, () => spawn());
}
addEventListener('resize', resize);

function angleAt(x, y, t, settings) {
  const n = noise(x * settings.scale, y * settings.scale + t * 0.00004) * settings.turbulence;
  switch (settings.bias) {
    case 'rise': return -Math.PI / 2 + n * 1.6;
    case 'curtain': return Math.PI / 2 * Math.sin(x * 0.004 + t * 0.0002) + n * 0.7;
    case 'spiral': return Math.atan2(y - height / 2, x - width / 2) + Math.PI / 2 + n;
    case 'gust': return n * 1.2 + Math.sin(t * 0.0005) * 0.6;
    default: return n * Math.PI;
  }
}

function frame(now) {
  if (!reduceMotion) { ctx.fillStyle = `rgba(7, 7, 12, ${FADE})`; ctx.fillRect(0, 0, width, height); }
  if (++frameCount % DEEPEN_EVERY_FRAMES === 0) {
    ctx.globalCompositeOperation = 'multiply'; ctx.fillStyle = DEEPEN_COLOUR; ctx.fillRect(0, 0, width, height);
    ctx.globalCompositeOperation = 'source-over';
  }
  if (wipeAt) {
    // Fresh canvas: a dark tide sweeps across from the left.
    const progress = Math.min(1, (now - wipeAt) / 900);
    ctx.fillStyle = '#07070c'; ctx.fillRect(0, 0, width * progress, height);
    if (progress >= 1) wipeAt = 0;
  }
  if (nextMood) { blend = Math.min(1, blend + 0.01); if (blend >= 1) { mood = nextMood; nextMood = null; } }
  if (keyboard.state !== 'connected' && now - lastAutopilot > AUTOPILOT_MS) {
    lastAutopilot = now;
    setMood(MOOD_IDS[(MOOD_IDS.indexOf(Object.keys(MOODS).find(id => MOODS[id] === (nextMood ?? mood))) + 1) % MOOD_IDS.length], false);
  }
  const settings = nextMood && blend > 0.5 ? nextMood : mood;
  ctx.lineWidth = 1.3; ctx.lineCap = 'round';
  ctx.globalCompositeOperation = 'lighter';
  for (const particle of particles) {
    if (burst && now - burst.at < 60 && Math.random() < 0.25) { particle.x = burst.x + (Math.random() - 0.5) * 80; particle.y = burst.y + (Math.random() - 0.5) * 80; }
    const angle = angleAt(particle.x, particle.y, now, settings);
    const fromX = particle.x, fromY = particle.y;
    particle.x += Math.cos(angle) * settings.speed;
    particle.y += Math.sin(angle) * settings.speed;
    const palette = (nextMood && Math.random() < blend ? nextMood : mood).colours;
    ctx.strokeStyle = palette[particle.shade];
    ctx.globalAlpha = 0.16;
    ctx.beginPath(); ctx.moveTo(fromX, fromY); ctx.lineTo(particle.x, particle.y); ctx.stroke();
    if (--particle.life < 0 || particle.x < -5 || particle.y < -5 || particle.x > width + 5 || particle.y > height + 5) spawn(particle);
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
  requestAnimationFrame(frame);
}

resize();
requestAnimationFrame(frame);
</script>
</body>
</html>
