<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Light Trail</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Chakra+Petch:wght@500;600&display=swap">
<style>
/* An LED stadium board: the whole screen is the dot matrix; a scoreboard strip runs along the top. Single dark look. */
:root {
  color-scheme: dark;
  --board: #050506;
  --strip: #0d0d10;
  --strip-edge: #26262c;
  --player: #ffb020;
  --bot-a: #22d3ee;
  --bot-b: #f0468c;
  --text: #f2efe6;
  --muted: #8c8a84;
  --pixel: "Silkscreen", "Courier New", monospace;
  --body: "Chakra Petch", "Arial", sans-serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--board); color: var(--text); font-family: var(--body); overflow: hidden; }
canvas { position: fixed; left: 0; right: 0; bottom: 0; width: 100%; display: block; }
.strip {
  position: fixed; inset: 0 0 auto 0; display: flex; align-items: center; justify-content: space-between; gap: 3vmin;
  padding: 1.4vmin 3vmin; background: var(--strip); border-bottom: 2px solid var(--strip-edge);
}
.strip h1 { margin: 0; font: 700 clamp(18px, 4vmin, 56px)/1 var(--pixel); color: var(--player); letter-spacing: .04em; }
.scores { display: flex; gap: 4vmin; font: clamp(13px, 2.4vmin, 32px)/1.1 var(--pixel); font-variant-numeric: tabular-nums; }
.scores span { display: grid; gap: .3vmin; }
.scores small { font: 600 clamp(10px, 1.4vmin, 18px)/1 var(--body); color: var(--muted); letter-spacing: .14em; text-transform: uppercase; }
.dock {
  position: fixed; right: 3vmin; bottom: 3vmin; width: clamp(200px, 25vmin, 340px);
  display: grid; gap: 1.1vmin; padding: 2vmin; background: #000c; border: 2px solid var(--strip-edge); border-radius: 4px;
}
.dock h2 { margin: 0; font: 700 clamp(15px, 2.6vmin, 34px)/1.1 var(--pixel); color: var(--player); }
.dock p { margin: 0; font-size: clamp(12px, 1.8vmin, 22px); line-height: 1.3; color: var(--muted); }
.qrkeyboard-pairing { display: grid; gap: 1vmin; }
.qrkeyboard-pairing p { margin: 0; font-size: clamp(12px, 1.7vmin, 20px); color: var(--muted); }
.qrkeyboard-pairing [role="status"] { color: var(--player); text-transform: uppercase; letter-spacing: .1em; font-weight: 600; }
.qrkeyboard-code { background: #fff; }
.qrkeyboard-code svg { width: 100%; height: auto; display: block; }
.qrkeyboard-pairing button { font: inherit; padding: .5em 1em; border: 0; background: var(--player); color: var(--board); }
</style>
</head>
<body>
<header class="strip">
  <h1>Light Trail</h1>
  <div class="scores">
    <span><small>Score</small><b id="score">0</b></span>
    <span><small>Best today</small><b id="best">0</b></span>
    <span><small>Rider</small><b id="rider">Bots</b></span>
  </div>
</header>
<canvas id="board" aria-hidden="true"></canvas>
<aside class="dock" aria-live="polite">
  <h2 id="headline">Ride the light</h2>
  <p id="hint">Scan to take the amber bike. Outlast the bots.</p>
  <div id="qr"></div>
</aside>
<script src="https://qrkeyboard.com/v1.js"></script>
<script>
// ── Game rules ──────────────────────────────────────────────────────────────
const COLUMNS = 80;               // LED dots across; rows follow the screen's aspect
const TICK_MS = 95;               // one step per tick
const SPARK_POINTS = 50;
const STEP_POINTS = 1;
const ROUND_PAUSE_MS = 2600;      // between a crash and the next round
const IDLE_MS = 30 * 1000;        // no turns for this long ends the rider's turn
const TURN_MS = 4 * 60 * 1000;
const BOT_LOOKAHEAD = 6;
const DIRECTIONS = [[1, 0], [0, 1], [-1, 0], [0, -1]]; // right, down, left, up (clockwise)

const keyboard = QRKeyboard.create({
  el: '#qr', name: 'Light Trail', caps: ['buttons'],
  actions: [{ id: 'left', label: '◀  Turn left' }, { id: 'right', label: 'Turn right  ▶' }],
});

const scoreEl = document.getElementById('score');
const bestEl = document.getElementById('best');
const riderEl = document.getElementById('rider');
const headline = document.getElementById('headline');
const hint = document.getElementById('hint');
let best = 0;
try { best = Number(localStorage.getItem('light-trail-best') ?? 0) || 0; } catch {}
bestEl.textContent = best;

let rows = 45;
let grid;                 // Uint8Array: 0 empty, else rider id
let riders = [];
let sparks = [];
let score = 0;
let roundOverAt = 0;
let pendingTurn = 0;      // -1 left, +1 right, applied on the next tick
let turnStart = 0, lastInput = 0;
const human = () => keyboard.state === 'connected';

keyboard.on('action', ({ action }) => {
  lastInput = performance.now();
  pendingTurn = action === 'left' ? -1 : 1;
});
keyboard.on('state', ({ state }) => {
  const playing = state === 'connected';
  if (playing && !turnStart) { turnStart = lastInput = performance.now(); newRound(); }
  riderEl.textContent = playing ? 'You' : 'Bots';
  headline.textContent = playing ? 'You are amber' : 'Ride the light';
  hint.textContent = playing ? 'Turn left or right on your phone. Collect sparks, avoid every trail.' : 'Scan to take the amber bike. Outlast the bots.';
});
keyboard.on('finish', () => { turnStart = 0; newRound(); });
setInterval(() => {
  if (keyboard.state !== 'connected' && keyboard.state !== 'waiting') return;
  const now = performance.now();
  if (now - lastInput > IDLE_MS || now - turnStart > TURN_MS) keyboard.finish().catch(() => {});
}, 1000);

function newRound() {
  grid = new Uint8Array(COLUMNS * rows);
  const middle = Math.floor(rows / 2);
  riders = [
    { id: 1, x: 8, y: middle, direction: 0, colour: 'player', alive: true, bot: !human() },
    { id: 2, x: COLUMNS - 9, y: Math.floor(rows * 0.25), direction: 2, colour: 'bot-a', alive: true, bot: true },
    { id: 3, x: COLUMNS - 9, y: Math.floor(rows * 0.75), direction: 2, colour: 'bot-b', alive: true, bot: true },
  ];
  for (const rider of riders) grid[rider.y * COLUMNS + rider.x] = rider.id;
  sparks = [];
  for (let i = 0; i < 4; i++) placeSpark();
  score = 0; scoreEl.textContent = 0; roundOverAt = 0; pendingTurn = 0;
}

function free(x, y) { return x >= 0 && y >= 0 && x < COLUMNS && y < rows && grid[y * COLUMNS + x] === 0; }
function placeSpark() {
  for (let attempt = 0; attempt < 200; attempt++) {
    const x = 2 + Math.floor(Math.random() * (COLUMNS - 4)), y = 2 + Math.floor(Math.random() * (rows - 4));
    if (free(x, y)) { sparks.push({ x, y }); return; }
  }
}
function clearRun(rider, direction) {
  const [dx, dy] = DIRECTIONS[direction];
  let run = 0;
  while (run < BOT_LOOKAHEAD && free(rider.x + dx * (run + 1), rider.y + dy * (run + 1))) run++;
  return run;
}
/** Bots keep going straight while the way is clear, turn toward open space otherwise, and wander a little. */
const BOT_WANDER = 0.06;          // chance per tick that a bot turns into open space unprompted
const BOT_MIN_TURN_ROOM = 3;

function steerBot(rider) {
  const ahead = clearRun(rider, rider.direction);
  const left = (rider.direction + 3) % 4, right = (rider.direction + 1) % 4;
  const leftRun = clearRun(rider, left), rightRun = clearRun(rider, right);
  if (ahead >= BOT_LOOKAHEAD) {
    if (Math.random() > BOT_WANDER) return;
    const options = [left, right].filter(direction => clearRun(rider, direction) >= BOT_MIN_TURN_ROOM);
    if (options.length) rider.direction = options[Math.floor(Math.random() * options.length)];
    return;
  }
  if (ahead >= Math.max(leftRun, rightRun) && ahead > 1) return;
  rider.direction = leftRun > rightRun || (leftRun === rightRun && Math.random() < 0.5) ? left : right;
}

function tick(now) {
  if (roundOverAt) { if (now - roundOverAt > ROUND_PAUSE_MS) newRound(); return; }
  for (const rider of riders) {
    if (!rider.alive) continue;
    if (rider.id === 1 && !rider.bot) {
      if (pendingTurn) rider.direction = (rider.direction + (pendingTurn < 0 ? 3 : 1)) % 4;
      pendingTurn = 0;
    } else steerBot(rider);
    const [dx, dy] = DIRECTIONS[rider.direction];
    const x = rider.x + dx, y = rider.y + dy;
    if (!free(x, y)) { rider.alive = false; rider.crashedAt = now; continue; }
    rider.x = x; rider.y = y; grid[y * COLUMNS + x] = rider.id;
    const spark = sparks.findIndex(each => each.x === x && each.y === y);
    if (spark >= 0) { sparks.splice(spark, 1); placeSpark(); if (rider.id === 1) score += SPARK_POINTS; }
  }
  const player = riders[0];
  if (player.alive) score += STEP_POINTS;
  scoreEl.textContent = score;
  const botsLeft = riders.slice(1).some(rider => rider.alive);
  if (!player.alive || !botsLeft) {
    roundOverAt = now;
    if (!player.alive || !botsLeft) {
      if (!player.bot && score > best) {
        best = score; bestEl.textContent = best;
        try { localStorage.setItem('light-trail-best', String(best)); } catch {}
      }
    }
  }
}

// ── LED rendering ───────────────────────────────────────────────────────────
const canvas = document.getElementById('board');
const ctx = canvas.getContext('2d');
let pitch = 10, cssColours = {};

function resize() {
  const scale = Math.min(devicePixelRatio || 1, 2);
  const stripHeight = document.querySelector('.strip').getBoundingClientRect().height;
  const available = innerHeight - stripHeight;
  pitch = innerWidth / COLUMNS;
  rows = Math.max(20, Math.floor(available / pitch));
  canvas.style.height = available + 'px';
  canvas.width = innerWidth * scale; canvas.height = available * scale;
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  const styles = getComputedStyle(document.documentElement);
  cssColours = { player: styles.getPropertyValue('--player').trim(), 'bot-a': styles.getPropertyValue('--bot-a').trim(), 'bot-b': styles.getPropertyValue('--bot-b').trim() };
  newRound();
}
addEventListener('resize', resize);

function dot(x, y, colour, radius, glow) {
  const cx = (x + 0.5) * pitch, cy = (y + 0.5) * pitch + (canvas.clientHeight - rows * pitch) / 2;
  ctx.shadowBlur = glow; ctx.shadowColor = colour; ctx.fillStyle = colour;
  ctx.beginPath(); ctx.arc(cx, cy, radius, 0, Math.PI * 2); ctx.fill();
}

let lastTick = 0;
function frame(now) {
  if (now - lastTick >= TICK_MS) { lastTick = now; tick(now); }
  const height = canvas.clientHeight;
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#050506'; ctx.fillRect(0, 0, innerWidth, height);
  // Unlit LEDs.
  ctx.fillStyle = '#16161b';
  const offset = (height - rows * pitch) / 2;
  for (let y = 0; y < rows; y++)
    for (let x = 0; x < COLUMNS; x++) { ctx.beginPath(); ctx.arc((x + 0.5) * pitch, (y + 0.5) * pitch + offset, pitch * 0.28, 0, Math.PI * 2); ctx.fill(); }
  // Trails, dimmer than the bike heads.
  for (let index = 0; index < grid.length; index++) {
    const id = grid[index];
    if (!id) continue;
    const rider = riders[id - 1];
    ctx.globalAlpha = rider.alive ? 0.75 : Math.max(0.15, 0.75 - (now - rider.crashedAt) / 1500);
    dot(index % COLUMNS, Math.floor(index / COLUMNS), cssColours[rider.colour], pitch * 0.36, pitch * 0.6);
  }
  ctx.globalAlpha = 1;
  for (const spark of sparks) dot(spark.x, spark.y, '#ffffff', pitch * (0.3 + Math.sin(now / 120 + spark.x) * 0.08), pitch * 1.4);
  for (const rider of riders) {
    if (rider.alive) dot(rider.x, rider.y, '#ffffff', pitch * 0.44, pitch * 2);
    else if (now - rider.crashedAt < 900) {
      const blast = (now - rider.crashedAt) / 900;
      ctx.globalAlpha = 1 - blast;
      for (let ring = 0; ring < 12; ring++) {
        const angle = (ring / 12) * Math.PI * 2;
        dot(rider.x + Math.cos(angle) * blast * 6, rider.y + Math.sin(angle) * blast * 6, cssColours[rider.colour], pitch * 0.4, pitch);
      }
      ctx.globalAlpha = 1;
    }
  }
  if (roundOverAt) {
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#000a'; ctx.fillRect(0, height * 0.38, innerWidth, height * 0.24);
    ctx.font = `700 ${pitch * 3.2}px Silkscreen, monospace`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = cssColours.player;
    const won = riders[0].alive;
    ctx.fillText(riders[0].bot ? 'Scan to ride' : won ? `You win · ${score}` : `Crashed · ${score}`, innerWidth / 2, height / 2);
  }
  requestAnimationFrame(frame);
}

document.fonts.load('40px Silkscreen').finally(() => { resize(); requestAnimationFrame(frame); });
</script>
</body>
</html>
