<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neon Wall</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tilt+Neon&family=Barlow+Condensed:wght@500;700&display=swap">
<style>
/* A night alley: one brick wall, one sign, one placard. Single dark look. */
:root {
  color-scheme: dark;
  --night: #0d0709;
  --plaque: #1c1215;
  --plaque-edge: #3a2a2e;
  --chalk: #f3e9e4;
  --dim: #a8958f;
  --tube: #ff4fa3;
  --sign: "Tilt Neon", "Comic Sans MS", cursive;
  --label: "Barlow Condensed", "Arial Narrow", sans-serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--night); color: var(--chalk); font-family: var(--label); overflow: hidden; }
canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
.brand {
  position: fixed; top: 2.5vmin; left: 3vmin; margin: 0;
  font-size: clamp(14px, 2.2vmin, 26px); letter-spacing: .18em; text-transform: uppercase; color: var(--dim);
}
.brand b { color: var(--chalk); font-weight: 700; }
.placard {
  position: fixed; right: 3vmin; bottom: 3vmin; width: clamp(200px, 26vmin, 360px);
  padding: 2.2vmin; display: grid; gap: 1.2vmin;
  background: var(--plaque); border: 2px solid var(--plaque-edge); border-radius: 6px;
  box-shadow: 0 0 0 6px #0008, 0 30px 60px #000a;
}
.placard h2 { margin: 0; font: 700 clamp(18px, 3.4vmin, 44px)/1 var(--label); text-transform: uppercase; letter-spacing: .04em; }
.placard p { margin: 0; font-size: clamp(14px, 2vmin, 24px); color: var(--dim); line-height: 1.3; }
.qrkeyboard-pairing { display: grid; gap: 1vmin; }
.qrkeyboard-pairing [role="status"] { margin: 0; font-size: clamp(13px, 1.8vmin, 22px); color: var(--tube); letter-spacing: .06em; text-transform: uppercase; }
.qrkeyboard-pairing p { margin: 0; font-size: clamp(13px, 1.8vmin, 22px); color: var(--dim); }
.qrkeyboard-code { background: #fff; padding: 0; border-radius: 4px; }
.qrkeyboard-code svg { width: 100%; height: auto; display: block; }
.qrkeyboard-pairing button { font: inherit; padding: .6em 1em; background: var(--chalk); color: var(--night); border: 0; border-radius: 4px; }
.timer { height: 6px; border-radius: 3px; background: var(--plaque-edge); overflow: hidden; }
.timer span { display: block; height: 100%; width: 100%; background: var(--tube); transform-origin: left; }
@media (prefers-reduced-motion: reduce) { .timer span { transition: none; } }
</style>
</head>
<body>
<canvas id="wall" aria-hidden="true"></canvas>
<p class="brand"><b>Neon Wall</b> · QRKeyboard</p>
<aside class="placard" aria-live="polite">
  <h2 id="headline">Write in neon</h2>
  <p id="hint">Scan, then type on your phone. Pick a colour with the buttons.</p>
  <div id="qr"></div>
  <div class="timer" id="timer" hidden><span id="timeleft"></span></div>
</aside>
<script src="https://qrkeyboard.com/v1.js"></script>
<script>
// ── Billboard turn rules ────────────────────────────────────────────────────
const TURN_MS = 3 * 60 * 1000;   // one visitor's turn
const IDLE_MS = 45 * 1000;       // no input for this long ends the turn
const MAX_LINES = 4;
const MAX_CHARS = 120;
const COLOURS = {
  pink: '#ff4fa3', cyan: '#39e6ff', lime: '#9dff4a', amber: '#ffb238', violet: '#b07cff',
};
const ATTRACT = 'Scan me\nwrite in neon';

const keyboard = QRKeyboard.create({
  el: '#qr', name: 'Neon Wall', caps: ['keyboard', 'buttons'], submitLabel: 'New line',
  actions: Object.keys(COLOURS).map(id => ({ id, label: id[0].toUpperCase() + id.slice(1) })),
});

let text = '';
let colour = COLOURS.pink;
let turnStart = 0;
let lastInput = 0;
let letters = [];        // { char, born } for the visitor's text
let attractColour = 0;

const headline = document.getElementById('headline');
const hint = document.getElementById('hint');
const timer = document.getElementById('timer');
const timeLeft = document.getElementById('timeleft');

function touch() { lastInput = performance.now(); }
function setText(next) {
  const now = performance.now();
  const chars = [...next].slice(0, MAX_CHARS);
  letters = chars.map((char, index) => letters[index]?.char === char ? letters[index] : { char, born: now });
  text = chars.join('');
}

keyboard.on('key', event => {
  touch();
  if (event.text !== undefined) setText(text + event.text);
  else if (event.code === 8) setText([...text].slice(0, -1).join(''));
  else if (event.code === 10 && text.split('\n').length < MAX_LINES) setText(text + '\n');
});
keyboard.on('action', event => {
  touch();
  colour = COLOURS[event.action] ?? colour;
  document.documentElement.style.setProperty('--tube', colour);
  for (const letter of letters) letter.born = performance.now() - 200; // re-strike the tubes
});
keyboard.on('state', ({ state }) => {
  const playing = state === 'connected';
  timer.hidden = !playing;
  if (playing && !turnStart) turnStart = lastInput = performance.now();
  headline.textContent = playing ? 'Writing now' : state === 'waiting' ? 'Come back?' : 'Write in neon';
  hint.textContent = playing ? 'Type on your phone. Tap Finish when you are done.'
    : state === 'waiting' ? 'The writer’s phone dropped. The wall resets shortly.'
    : 'Scan, then type on your phone. Pick a colour with the buttons.';
});
keyboard.on('finish', () => {
  text = ''; letters = []; turnStart = 0; colour = COLOURS.pink;
  document.documentElement.style.setProperty('--tube', colour);
});

setInterval(() => {
  if (keyboard.state !== 'connected' && keyboard.state !== 'waiting') return;
  const now = performance.now();
  timeLeft.style.transform = `scaleX(${Math.max(0, 1 - (now - turnStart) / TURN_MS)})`;
  if (now - lastInput > IDLE_MS || now - turnStart > TURN_MS) keyboard.finish().catch(() => {});
}, 500);

// ── Rendering ───────────────────────────────────────────────────────────────
const canvas = document.getElementById('wall');
const ctx = canvas.getContext('2d');
const bricks = document.createElement('canvas');
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
let width = 0, height = 0, scale = 1;

function paintBricks() {
  bricks.width = canvas.width; bricks.height = canvas.height;
  const b = bricks.getContext('2d');
  b.fillStyle = '#120a0c'; b.fillRect(0, 0, bricks.width, bricks.height);
  const rowHeight = bricks.height / 16, brickWidth = rowHeight * 2.3, mortar = Math.max(2, rowHeight * 0.07);
  let seed = 7;
  const random = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  for (let row = 0; row * rowHeight < bricks.height; row++) {
    const offset = row % 2 ? brickWidth / 2 : 0;
    for (let x = -offset; x < bricks.width; x += brickWidth) {
      const shade = 34 + random() * 22;
      b.fillStyle = `rgb(${shade + 14}, ${shade * 0.45}, ${shade * 0.5})`;
      b.fillRect(x + mortar, row * rowHeight + mortar, brickWidth - mortar * 2, rowHeight - mortar * 2);
    }
  }
  const vignette = b.createRadialGradient(bricks.width / 2, bricks.height * 0.42, bricks.height * 0.1, bricks.width / 2, bricks.height * 0.5, bricks.width * 0.75);
  vignette.addColorStop(0, '#0000'); vignette.addColorStop(1, '#000e');
  b.fillStyle = vignette; b.fillRect(0, 0, bricks.width, bricks.height);
  const floor = b.createLinearGradient(0, bricks.height * 0.8, 0, bricks.height);
  floor.addColorStop(0, '#0000'); floor.addColorStop(1, '#000');
  b.fillStyle = floor; b.fillRect(0, bricks.height * 0.8, bricks.width, bricks.height * 0.2);
}

function resize() {
  scale = Math.min(devicePixelRatio || 1, 2);
  width = innerWidth; height = innerHeight;
  canvas.width = width * scale; canvas.height = height * scale;
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  paintBricks();
}
addEventListener('resize', resize);

const WRAP_AT = 18; // characters per tube line before wrapping at a space

/** Splits glyphs into lines at newlines and, past WRAP_AT, at the last space. */
function wrapGlyphs(glyphs) {
  const lines = [[]];
  for (const glyph of glyphs) {
    const line = lines[lines.length - 1];
    if (glyph.char === '\n') { lines.push([]); continue; }
    line.push(glyph);
    if (line.length > WRAP_AT) {
      const space = line.map(each => each.char).lastIndexOf(' ');
      if (space > 0) lines.push(line.splice(space).slice(1));
    }
  }
  return lines.slice(-MAX_LINES);
}

function fitSize(lines) {
  let size = Math.min(height * 0.24, width * 0.16);
  const family = getComputedStyle(document.documentElement).getPropertyValue('--sign');
  const fits = () => {
    ctx.font = `${size}px ${family}`;
    return lines.every(line => ctx.measureText(line.map(glyph => glyph.char).join('')).width < width * 0.72)
      && lines.length * size * 1.15 < height * 0.62;
  };
  while (!fits() && size > 18) size *= 0.92;
  return size;
}

/** Brightness of one tube: strikes on with a stutter, then hums with rare dropouts. */
function brightness(born, now, index) {
  const age = now - born;
  if (age < 0) return 0;
  if (age < 700 && !reduceMotion) return [1, 0, 1, 0.2, 1, 0, 1][Math.floor(age / 100)] ?? 1;
  const hum = Math.sin(now / 90 + index * 1.7) * 0.03;
  const dropout = !reduceMotion && Math.sin(now / 1300 + index * 12.9) > 0.995 ? -0.7 : 0;
  return Math.max(0, Math.min(1, 0.97 + hum + dropout));
}

function drawSign(lines, hue, now, opacity = 1) {
  const size = fitSize(lines);
  const lineHeight = size * 1.15;
  const top = height * 0.42 - (lines.length * lineHeight) / 2 + size * 0.8;
  ctx.textBaseline = 'alphabetic';
  let lit = 0;
  let index = 0;
  lines.forEach((line, row) => {
    let x = width * 0.46 - ctx.measureText(line.map(glyph => glyph.char).join('')).width / 2;
    const y = top + row * lineHeight;
    for (const glyph of line) {
      const level = brightness(glyph.born, now, index++);
      lit += level;
      // Unlit glass tube, then three glow passes from wide halo to hot core.
      ctx.shadowBlur = 0; ctx.globalAlpha = opacity; ctx.fillStyle = '#ffffff16'; ctx.fillText(glyph.char, x, y);
      if (level > 0.05) {
        ctx.fillStyle = hue; ctx.shadowColor = hue;
        ctx.globalAlpha = opacity * level * 0.55; ctx.shadowBlur = size * 0.6; ctx.fillText(glyph.char, x, y);
        ctx.globalAlpha = opacity * level; ctx.shadowBlur = size * 0.18; ctx.fillText(glyph.char, x, y);
        ctx.shadowBlur = size * 0.04; ctx.fillStyle = '#fff6fb'; ctx.globalAlpha = opacity * level * 0.85; ctx.fillText(glyph.char, x, y);
      }
      x += ctx.measureText(glyph.char).width;
    }
  });
  ctx.globalAlpha = 1; ctx.shadowBlur = 0;
  return lit;
}

const ATTRACT_PERIOD_MS = 6000;
const CURSOR_BLINK_MS = 1000;

function frame(now) {
  ctx.drawImage(bricks, 0, 0, width, height);
  const playing = keyboard.state === 'connected';
  let glyphs = letters, hue = colour;
  if (!playing && !text) {
    const palette = Object.values(COLOURS);
    const cycle = Math.floor(now / ATTRACT_PERIOD_MS);
    hue = palette[cycle % palette.length];
    glyphs = [...ATTRACT].map((char, index) => ({ char, born: cycle * ATTRACT_PERIOD_MS + index * 60 }));
  } else if (playing && !text) {
    glyphs = [{ char: now % CURSOR_BLINK_MS < CURSOR_BLINK_MS / 2 ? '_' : ' ', born: 0 }];
  }
  const lines = wrapGlyphs(glyphs);
  const lit = drawSign(lines, hue, now);
  // Light spilling onto the wall, proportional to how much tube is lit.
  const spill = ctx.createRadialGradient(width * 0.46, height * 0.42, 0, width * 0.46, height * 0.42, width * 0.55);
  spill.addColorStop(0, hue + Math.round(Math.min(0.35, lit * 0.012) * 255).toString(16).padStart(2, '0'));
  spill.addColorStop(1, '#0000');
  ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = spill; ctx.fillRect(0, 0, width, height);
  ctx.globalCompositeOperation = 'source-over';
  // Wet-pavement reflection of the sign.
  ctx.save();
  // Mirror about the pavement line so the sign (centred near 42% height)
  // reflects just above the bottom edge.
  ctx.translate(0, height * 1.08); ctx.scale(1, -0.45);
  drawSign(lines, hue, now, 0.16);
  ctx.restore();
  requestAnimationFrame(frame);
}

resize();
document.fonts.load('80px "Tilt Neon"').finally(() => requestAnimationFrame(frame));
</script>
</body>
</html>
