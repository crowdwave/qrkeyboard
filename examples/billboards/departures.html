<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Departures Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Text:wght@600;800&family=IBM+Plex+Sans+Condensed:wght@500;600&display=swap">
<style>
/* A station concourse: the split-flap board fills the left, an information pillar stands at the right. Single dark look. */
:root {
  color-scheme: dark;
  --hall: #101214;
  --frame: #0b0c0d;
  --flap: #2c3034;
  --flap-low: #25282c;
  --hinge: #08090a;
  --white: #f1efe7;
  --amber: #f6c445;
  --muted: #8e959b;
  --signage: "Big Shoulders Text", "Arial Narrow", sans-serif;
  --body: "IBM Plex Sans Condensed", "Arial Narrow", sans-serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--hall); color: var(--white); font-family: var(--body); overflow: hidden;
  display: grid; grid-template-columns: minmax(0, 1fr) clamp(220px, 24vw, 420px); gap: 3vmin; padding: 3vmin;
}
.board { min-width: 0; display: grid; grid-template-rows: auto 1fr; gap: 2vmin; }
.board header { display: flex; align-items: baseline; justify-content: space-between; gap: 2vmin; }
.board h1 { margin: 0; font: 800 clamp(28px, 6.5vmin, 96px)/.9 var(--signage); letter-spacing: .02em; text-transform: uppercase; }
.board h1 span { color: var(--amber); }
.clock { font: 800 clamp(24px, 5vmin, 72px)/1 var(--signage); color: var(--amber); font-variant-numeric: tabular-nums; }
canvas { width: 100%; height: 100%; display: block; background: var(--frame); border-radius: 6px; }
.pillar { display: grid; align-content: end; gap: 1.6vmin; padding: 2.4vmin; background: var(--frame); border-radius: 6px; border-top: 1.2vmin solid var(--amber); }
.pillar .info { width: 7vmin; height: 7vmin; display: grid; place-items: center; border-radius: 50%; background: var(--amber); color: var(--hall); font: 800 5vmin/1 var(--signage); }
.pillar h2 { margin: 0; font: 800 clamp(22px, 4.4vmin, 60px)/.95 var(--signage); text-transform: uppercase; }
.pillar p { margin: 0; font-size: clamp(13px, 2vmin, 24px); line-height: 1.3; color: var(--muted); }
.qrkeyboard-pairing { display: grid; gap: 1.1vmin; }
.qrkeyboard-pairing p { margin: 0; font-size: clamp(12px, 1.8vmin, 21px); color: var(--muted); }
.qrkeyboard-pairing [role="status"] { color: var(--amber); font-weight: 600; text-transform: uppercase; letter-spacing: .1em; }
.qrkeyboard-code { background: #fff; border-radius: 4px; overflow: hidden; }
.qrkeyboard-code svg { width: 100%; height: auto; display: block; }
.qrkeyboard-pairing button { font: inherit; padding: .5em 1em; border: 0; border-radius: 4px; background: var(--amber); color: var(--hall); }
@media (max-width: 760px) { body { grid-template-columns: 1fr; grid-template-rows: 1fr auto; } }
</style>
</head>
<body>
<main class="board">
  <header><h1>Departures <span>· Messages</span></h1><div class="clock" id="clock">00:00</div></header>
  <canvas id="flaps" aria-label="Departures board of visitor messages"></canvas>
</main>
<aside class="pillar" aria-live="polite">
  <div class="info" aria-hidden="true">i</div>
  <h2 id="headline">Post a message</h2>
  <p id="hint">Scan, write up to 22 characters, tap Post. It joins the board.</p>
  <div id="qr"></div>
</aside>
<script src="https://qrkeyboard.com/v1.js"></script>
<script>
const TURN_MS = 2 * 60 * 1000;
const IDLE_MS = 40 * 1000;
const ROWS = 10;
const COLUMNS = { time: 5, message: 22, gate: 3, status: 8 };
const GAP = 1;
const WIDTH = COLUMNS.time + GAP + COLUMNS.message + GAP + COLUMNS.gate + GAP + COLUMNS.status;
const DRUM = " ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789.,:!?'-&/@#";
const FLIP_MS = 45;           // one flap falling
const COLUMN_STAGGER_MS = 28; // the ripple across a row
const IDLE_FLIP_EVERY_MS = 7000;
// Board copy shown before anyone posts; visitor posts push these down.
const EXAMPLES = [
  ['SCAN THE CODE TO POST', 'NOW'], ['GOOD MORNING CONCOURSE', 'ON TIME'], ['COFFEE CART BY GATE 4', 'ON TIME'],
  ['LOST: BLUE UMBRELLA', 'DELAYED'], ['HAPPY BIRTHDAY GRANDPA', 'ON TIME'], ['WELCOME HOME SAM', 'LANDED'],
  ['MIND THE GAP', 'ON TIME'], ['SEE YOU IN PARIS', 'DEPARTED'],
  ['PLATFORM PIANO IS FREE', 'ON TIME'], ['THANK YOU NIGHT CREW', 'DEPARTED'],
];

const keyboard = QRKeyboard.create({ el: '#qr', name: 'Departures Board', mode: 'text', submitLabel: 'Post' });
const headline = document.getElementById('headline');
const hint = document.getElementById('hint');
let turnStart = 0, lastInput = 0;

const clockText = (date = new Date()) => date.toTimeString().slice(0, 5);
const gate = () => 'ABCDE'[Math.floor(Math.random() * 5)] + (1 + Math.floor(Math.random() * 9));
const pad = (text, length) => text.slice(0, length).padEnd(length, ' ');
/** Keeps only characters on the drum; everything else shows as a blank flap. */
const onDrum = text => [...text.toUpperCase()].map(char => DRUM.includes(char) ? char : ' ').join('');

let rows = EXAMPLES.map(([message, status], index) => ({
  time: clockText(new Date(Date.now() - index * 7 * 60 * 1000)), message, gate: gate(), status,
}));

function rowText(row) {
  return pad(row.time, COLUMNS.time) + ' ' + pad(onDrum(row.message), COLUMNS.message) + ' ' + pad(row.gate, COLUMNS.gate) + ' ' + pad(row.status, COLUMNS.status);
}

keyboard.on('text', ({ text }) => {
  lastInput = performance.now();
  const message = onDrum(text.replace(/\s+/g, ' ').trim()).slice(0, COLUMNS.message);
  if (!message.trim()) return;
  for (const row of rows) if (row.status === 'NOW') row.status = 'BOARDING';
  rows = [{ time: clockText(), message, gate: gate(), status: 'NOW' }, ...rows].slice(0, ROWS);
  rows.forEach((row, index) => { if (index > 3 && row.status === 'BOARDING') row.status = 'DEPARTED'; });
  setBoard();
});
keyboard.on('state', ({ state }) => {
  const playing = state === 'connected';
  if (playing && !turnStart) turnStart = lastInput = performance.now();
  headline.textContent = playing ? 'Write your message' : 'Post a message';
  hint.textContent = playing ? 'Up to 22 characters. Tap Post to put it on the board.' : 'Scan, write up to 22 characters, tap Post. It joins the board.';
});
keyboard.on('finish', () => { turnStart = 0; });
setInterval(() => {
  if (keyboard.state !== 'connected' && keyboard.state !== 'waiting') return;
  const now = performance.now();
  if (now - lastInput > IDLE_MS || now - turnStart > TURN_MS) keyboard.finish().catch(() => {});
}, 1000);

// ── Flaps ───────────────────────────────────────────────────────────────────
const canvas = document.getElementById('flaps');
const ctx = canvas.getContext('2d');
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
// One cell per board position: the character shown, its target, and the flip in progress.
const cells = Array.from({ length: ROWS * WIDTH }, () => ({ shown: ' ', target: ' ', next: ' ', flipStart: 0, startAt: 0 }));

function setBoard(now = performance.now()) {
  rows.forEach((row, rowIndex) => {
    [...rowText(row)].forEach((char, column) => {
      const cell = cells[rowIndex * WIDTH + column];
      if (cell.target === char) return;
      cell.target = char;
      cell.startAt = Math.max(cell.startAt, now + column * COLUMN_STAGGER_MS + rowIndex * 40);
      if (reduceMotion) { cell.shown = cell.next = char; }
    });
  });
}

let cellWidth = 0, cellHeight = 0, gapX = 0, gapY = 0, originX = 0, originY = 0;
function resize() {
  const scale = Math.min(devicePixelRatio || 1, 2);
  const box = canvas.getBoundingClientRect();
  canvas.width = box.width * scale; canvas.height = box.height * scale;
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  const margin = Math.min(box.width, box.height) * 0.04;
  // Width sets the flap size; flaps grow taller (up to 1:2) to fill the board's height.
  cellWidth = (box.width - margin * 2) / (WIDTH * 1.08);
  cellHeight = Math.min(cellWidth * 2, (box.height - margin * 2) / (ROWS * 1.18));
  gapX = cellWidth * 0.08; gapY = cellHeight * 0.18;
  originX = (box.width - WIDTH * (cellWidth + gapX)) / 2;
  originY = (box.height - ROWS * (cellHeight + gapY)) / 2;
}
addEventListener('resize', resize);

function glyphColour(column) {
  return column >= WIDTH - COLUMNS.status ? '#f6c445' : column < COLUMNS.time ? '#c8c6be' : '#f1efe7';
}

/** Draws one half (top or bottom) of a flap carrying `char`, squashed vertically by `squash`. */
function half(x, y, char, top, squash, colour) {
  const hinge = y + cellHeight / 2;
  ctx.save();
  ctx.beginPath();
  if (top) ctx.rect(x, hinge - (cellHeight / 2) * squash, cellWidth, (cellHeight / 2) * squash);
  else ctx.rect(x, hinge, cellWidth, (cellHeight / 2) * squash);
  ctx.clip();
  ctx.fillStyle = top ? '#2c3034' : '#25282c';
  ctx.beginPath(); ctx.roundRect(x, y, cellWidth, cellHeight, cellWidth * 0.12); ctx.fill();
  ctx.translate(x + cellWidth / 2, hinge);
  ctx.scale(1, squash);
  ctx.fillStyle = colour;
  ctx.fillText(char, 0, cellHeight * 0.04);
  ctx.restore();
}

function frame(now) {
  const box = canvas.getBoundingClientRect();
  ctx.clearRect(0, 0, box.width, box.height);
  ctx.font = `800 ${Math.min(cellHeight * 0.78, cellWidth * 1.45)}px "Big Shoulders Text", "Arial Narrow", sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (let row = 0; row < ROWS; row++) {
    for (let column = 0; column < WIDTH; column++) {
      const cell = cells[row * WIDTH + column];
      const x = originX + column * (cellWidth + gapX), y = originY + row * (cellHeight + gapY);
      const colour = glyphColour(column);
      // Advance the drum one character per flip until the target is showing.
      if (cell.shown !== cell.target && now >= cell.startAt && !cell.flipStart) {
        cell.next = DRUM[(DRUM.indexOf(cell.shown) + 1) % DRUM.length];
        cell.flipStart = now;
      }
      const progress = cell.flipStart ? Math.min(1, (now - cell.flipStart) / FLIP_MS) : 1;
      if (!cell.flipStart) {
        half(x, y, cell.shown, true, 1, colour);
        half(x, y, cell.shown, false, 1, colour);
      } else {
        half(x, y, cell.next, true, 1, colour);           // revealed behind the falling flap
        half(x, y, cell.shown, false, 1, colour);         // old bottom until covered
        if (progress < 0.5) half(x, y, cell.shown, true, 1 - progress * 2, colour);
        else half(x, y, cell.next, false, progress * 2 - 1, colour);
        if (progress >= 1) { cell.shown = cell.next; cell.flipStart = 0; }
      }
      ctx.fillStyle = '#08090a'; ctx.fillRect(x, y + cellHeight / 2 - 0.75, cellWidth, 1.5); // hinge
    }
  }
  // "NOW" rows blink their status like the real thing.
  rows.forEach((entry, row) => {
    if (entry.status !== 'NOW' || Math.floor(now / 600) % 2 || reduceMotion) return;
    const x = originX + (WIDTH - COLUMNS.status) * (cellWidth + gapX), y = originY + row * (cellHeight + gapY);
    ctx.fillStyle = '#2c3034e6'; ctx.fillRect(x, y, COLUMNS.status * (cellWidth + gapX), cellHeight);
  });
  requestAnimationFrame(frame);
}

// Keep the board alive between visitors: statuses change now and then.
const STATUS_CHANGES = { 'ON TIME': 'DELAYED', DELAYED: 'BOARDING', BOARDING: 'DEPARTED', LANDED: 'ON TIME', DEPARTED: 'ON TIME' };
setInterval(() => {
  if (keyboard.state === 'connected') return;
  const row = rows[1 + Math.floor(Math.random() * (rows.length - 1))];
  row.status = STATUS_CHANGES[row.status] ?? row.status;
  setBoard();
}, IDLE_FLIP_EVERY_MS);
setInterval(() => { document.getElementById('clock').textContent = clockText(); }, 1000);
document.getElementById('clock').textContent = clockText();

document.fonts.load('80px "Big Shoulders Text"').finally(() => { resize(); setBoard(); requestAnimationFrame(frame); });
</script>
</body>
</html>
