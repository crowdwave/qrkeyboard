<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Phone keyboard — message entry</title><style>body{font:18px/1.6 system-ui;max-width:680px;margin:40px auto;padding:20px}.qrkeyboard-code{max-width:240px}.qrkeyboard-code svg{width:100%}#message{min-height:100px;background:#f4f7f2;padding:20px;white-space:pre-wrap}button{font:inherit;padding:12px}[hidden]{display:none}</style></head><body>
<h1>Send a message from your phone.</h1><div id="qr"></div><p id="message"></p><p id="status" role="status"></p><button id="finish">Finish session</button>
<script src="https://qrkeyboard.com/v1.js"></script><script>
const message = document.querySelector('#message'), status = document.querySelector('#status');
const keyboard = QRKeyboard.create({ el: '#qr', mode: 'text', name: 'Guestbook', submitLabel: 'Send' });
keyboard.on('text', ({ text }) => { message.textContent = text; });
keyboard.on('finish', () => { message.textContent = ''; status.textContent = ''; });
keyboard.on('error', () => { status.textContent = 'Could not complete that operation. Try again.'; });
document.querySelector('#finish').onclick = () => keyboard.finish().catch(() => {});
</script></body></html>
