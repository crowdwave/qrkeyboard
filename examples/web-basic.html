<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Phone keyboard — live typing</title>
<style>body{font:18px/1.6 system-ui;max-width:680px;margin:40px auto;padding:20px;color:#10251d}textarea{width:100%;min-height:140px;font:inherit;padding:14px}.qrkeyboard-code{max-width:240px}.qrkeyboard-code svg{width:100%}button{font:inherit;padding:12px}[hidden]{display:none}</style></head><body>
<h1>Type on your phone. See it here.</h1><div id="qr"></div>
<label for="output">Received text</label><textarea id="output" readonly></textarea>
<p id="result" role="status"></p><button id="finish">Finish session</button>
<script src="https://qrkeyboard.com/v1.js"></script>
<script>
const output = document.querySelector('#output'), result = document.querySelector('#result');
const keyboard = QRKeyboard.create({ el: '#qr', name: 'Live typing example', submitLabel: 'Submit' });
keyboard.on('key', event => {
  if (event.text !== undefined) output.value += event.text;
  else if (event.code === 8) output.value = [...output.value].slice(0, -1).join('');
  else if (event.code === 10) result.textContent = 'Submitted: ' + output.value;
});
keyboard.on('finish', () => { output.value = ''; result.textContent = ''; });
keyboard.on('error', () => { result.textContent = 'Could not complete that operation. Try again.'; });
document.querySelector('#finish').onclick = () => keyboard.finish().catch(() => {});
</script></body></html>
