<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>qrkeyboard — basic web example</title>
<style>
  body { font: 16px system-ui; max-width: 640px; margin: 40px auto; padding: 0 16px; }
  #qrkb svg { width: 240px; height: 240px; background: #fff; padding: 10px; border-radius: 10px; }
  #cursor { position: fixed; width: 16px; height: 16px; background: #1f6feb; border-radius: 50%; pointer-events: none; }
  #log { font: 13px ui-monospace, monospace; white-space: pre-wrap; color: #444; }
</style>

<h1>qrkeyboard basic example</h1>
<p>Scan this QR with your phone, then type / move / tap. Input appears below.</p>
<div id="qrkb"></div>
<div id="cursor"></div>
<pre id="log"></pre>

<script src="https://qrkeyboard.com/v1.js"></script>
<script>
  const log = m => (document.getElementById('log').textContent = m + "\n" + document.getElementById('log').textContent);
  let cx = innerWidth / 2, cy = innerHeight / 2;
  const cursor = document.getElementById('cursor');

  const kb = QRKeyboard.create({
    el: '#qrkb',
    caps: ['keyboard', 'gyro', 'buttons'],
    name: 'Web Example',
  });

  kb.on('connect',    () => log('📱 phone connected'));
  kb.on('disconnect', () => log('phone left'));
  kb.on('key',    e => log('key: ' + JSON.stringify(e)));
  kb.on('button', e => log('button ' + e.button + (e.down ? ' down' : ' up')));
  kb.on('move',   e => {
    cx = Math.max(0, Math.min(innerWidth, cx + e.dx));
    cy = Math.max(0, Math.min(innerHeight, cy + e.dy));
    cursor.style.transform = `translate(${cx}px, ${cy}px)`;
  });
</script>
